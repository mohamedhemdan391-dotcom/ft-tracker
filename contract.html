<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Follow up - Contract Extensions</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f2f2f2;
}

/* Header */
.header{
    background:#d40000;
    color:#fff;
    padding:22px;
    text-align:center;
    font-size:26px;
    font-weight:bold;
}

/* Form container */
.container{
    max-width:900px;
    margin:30px auto;
    background:#fff;
    padding:30px;
    border-radius:12px;
}

/* Fields */
label{
    display:block;
    margin-top:18px;
    font-weight:bold;
}

.desc{
    font-size:13px;
    color:#666;
    margin-top:4px;
}

input, select{
    width:100%;
    padding:12px;
    margin-top:6px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:6px;
}

/* Submit button */
button{
    margin-top:30px;
    width:100%;
    padding:18px;
    font-size:22px;
    background:#d40000;
    color:#fff;
    border:none;
    border-radius:12px;
    cursor:pointer;
}

/* Message center */
.message{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:#d40000;
    color:#fff;
    padding:20px 40px;
    font-size:22px;
    border-radius:12px;
    display:none;
    z-index:999;
}
</style>
</head>

<body>

<div class="header">
Follow up - Contract Extensions
</div>

<div class="container">

<form id="myForm">

<!-- Center -->
<label>Center Name - اسم المركز *</label>
<select name="entry.1615855283" required>
<option value="">Select</option>
<option>Shatie Dammam FT</option>
<option>Tarout FT</option>
<option>Sihat PRO 16+</option>
<option>Corniche FT 16+</option>
<option>Olaya FT 16+</option>
<option>Faisaliah FT 16+</option>
<option>Noor FT</option>
<option>Khobar Khozama FT 16+</option>
<option>Ahsa PRO 16+</option>
<option>Al Mutrafiyah FT</option>
<option>Golden Belt FT 16+</option>
<option>Montazah FT 16+</option>
<option>Ahsa Mubarraz FT</option>
<option>Jalmudah FT 16+</option>
<option>Firdaws FT 16+</option>
</select>

<!-- Member -->
<label>Member Name - اسم المشترك *</label>
<input name="entry.144583990" required>

<!-- Mobile -->
<label>Mobile Number - رقم الجوال *</label>
<div class="desc">Please write number starting with 05</div>
<input name="entry.307165346" pattern="05[0-9]{8}" required>

<!-- Trainer -->
<label>Trainer Name - اسم المدرب *</label>
<input name="entry.1178026807" required>

<!-- Contract Type -->
<label>Contract Type - نوع العقد *</label>
<select name="entry.157494334" required>
<option value="">Select</option>
<option>PT 6</option>
<option>PT 12</option>
<option>PT 24</option>
<option>PT 50</option>
<option>BUDDY PT 6</option>
<option>BUDDY PT 12</option>
<option>BUDDY PT 24</option>
<option>SWIM 6</option>
<option>SWIM 12</option>
<option>SWIM 24</option>
</select>

<!-- Expiry -->
<label>Contract Expiration Date - تاريخ نهاية العقد *</label>
<div class="desc">If contract expired last month or earlier, approval email required</div>
<input type="date" name="entry.1069043705" required>

<!-- Previous Extensions -->
<label>Number of Previous Extensions - عدد مرات التمديد السابقة *</label>
<input type="number" name="entry.466177843" required>

<!-- Remaining -->
<label>Remaining Sessions - الحصص المتبقية *</label>
<input type="number" name="entry.194941931" required>

<!-- Notes -->
<label>Notes - ملاحظات</label>
<input name="entry.356004514">

<button type="submit">إرسال</button>

</form>

</div>

<div id="msg" class="message"></div>

<script>
const form = document.getElementById("myForm");
const msg = document.getElementById("msg");

form.addEventListener("submit", function(e){
    e.preventDefault();

    // Check required fields
    const inputs = form.querySelectorAll("[required]");
    for(let input of inputs){
        if(!input.value){
            showMessage("يرجى تعبئة باقي البيانات");
            return;
        }
    }

    // Send to Google Form
    const formData = new FormData(form);

    fetch("https://docs.google.com/forms/d/e/1FAIpQLSfVo_4pKXkrX6Od8WRTt5X39APUpjptsMqk0EoNXspzEZxbsA/formResponse", {
        method: "POST",
        mode: "no-cors",
        body: formData
    }).then(() => {
        form.reset();
        showMessage("تم الإرسال");
    });
});

function showMessage(text){
    msg.innerText = text;
    msg.style.display = "block";
    setTimeout(()=>{
        msg.style.display = "none";
    },2000);
}
</script>

</body>
</html>
