<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Follow up - Contract Extensions</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f2f2f2;
}

.header{
    background:#d40000;
    color:#fff;
    padding:22px;
    text-align:center;
    font-size:26px;
    font-weight:bold;
}

.container{
    max-width:900px;
    margin:30px auto;
    background:#fff;
    padding:30px;
    border-radius:12px;
}

label{
    display:block;
    margin-top:18px;
    font-weight:bold;
}

input, select{
    width:100%;
    padding:12px;
    margin-top:6px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    margin-top:30px;
    width:100%;
    padding:18px;
    font-size:22px;
    background:#d40000;
    color:#fff;
    border:none;
    border-radius:12px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
Follow up - Contract Extensions
</div>

<div class="container">

<form action="https://docs.google.com/forms/d/e/1FAIpQLSfVo_4pKXkrX6Od8WRTt5X39APUpjptsMqk0EoNXspzEZxbsA/formResponse"
method="POST"
target="hidden_iframe">

<!-- Center Name -->
<label>Center Name *</label>
<select name="entry.1615855283" required>
<option value="">اختيار</option>
<option>Shatie Dammam FT</option>
<option>Tarout FT</option>
<option>Sihat PRO 16+</option>
<option>Corniche FT 16+</option>
<option>Olaya FT 16+</option>
<option>Faisaliah FT 16+</option>
<option>Noor FT</option>
<option>Khobar Khozama FT 16+</option>
<option>Ahsa PRO 16+</option>
<option>Al Mutrafiyah FT</option>
<option>Golden Belt FT 16+</option>
<option>Montazah FT 16+</option>
<option>Ahsa Mubarraz FT</option>
<option>Jalmudah FT 16+</option>
<option>Firdaws FT 16+</option>
</select>

<!-- Member Name -->
<label>Member Name *</label>
<input name="entry.144583990" required>

<!-- Mobile -->
<label>Mobile Number *</label>
<input name="entry.307165346" pattern="05[0-9]{8}" placeholder="05XXXXXXXX" required>

<!-- Trainer -->
<label>Trainer Name *</label>
<input name="entry.1178026807" required>

<!-- Contract Type -->
<label>Contract Type *</label>
<select name="entry.157494334" required>
<option value="">اختيار</option>
<option>PT 6</option>
<option>PT 12</option>
<option>PT 24</option>
<option>PT 50</option>
<option>BUDDY PT 6</option>
<option>BUDDY PT 12</option>
<option>BUDDY PT 24</option>
<option>SWIM 6</option>
<option>SWIM 12</option>
<option>SWIM 24</option>
</select>

<!-- Expiry Date -->
<label>Contract Expiration Date *</label>
<input type="date" name="entry.1069043705" required>

<!-- Previous Extensions -->
<label>Number of Previous Extensions *</label>
<input type="number" name="entry.466177843" required>

<!-- Remaining Sessions -->
<label>Remaining Sessions *</label>
<input type="number" name="entry.194941931" required>

<!-- Notes -->
<label>Notes</label>
<input name="entry.356004514">

<button type="submit">إرسال</button>

</form>

<iframe name="hidden_iframe" style="display:none;"></iframe>

</div>

</body>
</html>
